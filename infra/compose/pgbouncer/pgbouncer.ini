; PgBouncer for the local stack. Transaction pooling is the mode ADR-0021 assumes, and the reason
; tenant context is set with SET LOCAL inside a transaction: a server connection goes back to the pool
; at COMMIT carrying whatever session state was left on it. Local development only.

[databases]
; What services connect to.
orchestra = host=postgres port=5432 dbname=orchestra
; A pool of exactly one server connection, so smoke.sh can prove what a reused connection carries.
orchestra_probe = host=postgres port=5432 dbname=orchestra pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits
