# The local stack's OpenTelemetry Collector. The edge and both services export their spans here over
# OTLP/HTTP, and the debug exporter prints every span to this container's log, so a trace can be read
# with `docker compose logs otel-collector` and smoke.sh can check one. Where spans go outside the
# local stack is undecided (docs/60-operations/observability.md section 9).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
