# The local stack's OpenTelemetry Collector. The edge and both services export their spans here over
# OTLP/HTTP. The debug exporter prints every span to this container's log, which smoke.sh reads, and
# the otlphttp exporter sends every span on to Tempo, where Grafana reads it (ADR-0028). Only this
# file names where spans go.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  otlphttp/tempo:
    endpoint: http://tempo:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlphttp/tempo]
