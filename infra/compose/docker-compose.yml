# The local stack. Each service runs in its own container on one network, so a call that crosses
# the network in production crosses it here too (ADR-0020, rule B6). Local development only:
# every credential below is a throwaway value for this laptop and nothing else.
#
# Nothing is bind-mounted from the host. Configuration reaches containers through build contexts,
# which the Docker client uploads, so the stack works whether or not the daemon's VM shares this
# directory — an external drive is often not shared, and a bind mount then arrives empty.
name: orchestra

services:
  postgres:
    build: ./postgres
    image: orchestra-local/postgres:18.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-local-dev
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Transaction-mode pooling in front of PostgreSQL (ADR-0021). No published port: services reach
  # the pool on this network, as they will in production.
  pgbouncer:
    build: ./pgbouncer
    image: orchestra-local/pgbouncer:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6432"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Tenant User Management's migrations, applied as its schema's owner role, directly rather than
  # through the pool. A one-shot job: it exits once the schema is current, and `up --wait` waits
  # for that exit.
  tenant-user-management-migrate:
    build:
      context: ../../services/tenant-user-management
      dockerfile: db/Dockerfile
    image: orchestra-local/tenant-user-management-migrate:0.1.0
    environment:
      DATABASE_URL: postgres://tenant_user_management_owner:tenant-user-management-owner-local-dev@postgres:5432/orchestra?sslmode=disable&search_path=tenant_user_management
    depends_on:
      postgres:
        condition: service_healthy

  # Starts only once its schema is current, and connects as its own role through the pool. No
  # published port: services reach it on this network (ADR-0026), and nothing outside the stack does.
  tenant-user-management:
    build: ../../services/tenant-user-management
    image: orchestra-local/tenant-user-management:0.1.0
    environment:
      DATABASE_URL: postgresql://tenant_user_management_app:tenant-user-management-app-local-dev@pgbouncer:6432/orchestra
      # The issuer tokens carry, and the key set inside the network, exactly as the Gateway has them. A
      # credential to resolve names the Gateway as its audience; a caller's own token names this service.
      IDENTITY_PROVIDER_ISSUER: http://localhost:8080/realms/orchestra
      IDENTITY_PROVIDER_JWKS_URL: http://keycloak:8080/realms/orchestra/protocol/openid-connect/certs
      CREDENTIAL_AUDIENCE: orchestra-gateway
      SERVICE_AUDIENCE: tenant-user-management
      RESOLUTION_CALLERS: orchestra-gateway
      # Spans leave over OTLP/HTTP, under the variable OpenTelemetry specifies.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      pgbouncer:
        condition: service_healthy
      tenant-user-management-migrate:
        condition: service_completed_successfully

  # The service's integration suite, on this network and through the pool, as the service's own
  # roles, and against the local realm. `up` does not start it; smoke.sh runs it.
  tenant-user-management-integration:
    profiles: [test]
    build:
      context: ../../services/tenant-user-management
      dockerfile: test/integration.Dockerfile
    image: orchestra-local/tenant-user-management-integration:0.1.0
    environment:
      DATABASE_URL: postgresql://tenant_user_management_app:tenant-user-management-app-local-dev@pgbouncer:6432/orchestra
      IDENTITY_SYNC_DATABASE_URL: postgresql://tenant_user_management_identity_sync:tenant-user-management-identity-sync-local-dev@pgbouncer:6432/orchestra
      OWNER_DATABASE_URL: postgresql://tenant_user_management_owner:tenant-user-management-owner-local-dev@postgres:5432/orchestra
      # Identity sync reads the local realm as the service's own client, which can only read users.
      IDENTITY_PROVIDER_URL: http://keycloak:8080
      IDENTITY_PROVIDER_REALM: orchestra
      IDENTITY_SYNC_CLIENT_ID: tenant-user-management
      IDENTITY_SYNC_CLIENT_SECRET: tenant-user-management-local-dev
    depends_on:
      tenant-user-management:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    build: ./keycloak
    image: orchestra-local/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local-dev
      # Tokens are requested from the host at localhost:8080 and verified from inside the network
      # at keycloak:8080. The frontend hostname keeps the issuer stable; the dynamic backchannel lets
      # key and discovery requests use the internal name.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 60

  gateway:
    build: ../../services/gateway
    image: orchestra-local/gateway:0.1.0
    environment:
      ORCHESTRA_GATEWAY_ISSUER: http://localhost:8080/realms/orchestra
      ORCHESTRA_GATEWAY_JWKS_URL: http://keycloak:8080/realms/orchestra/protocol/openid-connect/certs
      ORCHESTRA_GATEWAY_AUDIENCE: orchestra-gateway
      # Resolution: the Gateway calls Tenant User Management as its own client, with a client
      # credentials token it obtains inside the network (credential-resolution.md).
      ORCHESTRA_GATEWAY_TENANT_USER_MANAGEMENT_URL: http://tenant-user-management:8080
      ORCHESTRA_GATEWAY_TOKEN_URL: http://keycloak:8080/realms/orchestra/protocol/openid-connect/token
      ORCHESTRA_GATEWAY_CLIENT_ID: orchestra-gateway
      ORCHESTRA_GATEWAY_CLIENT_SECRET: orchestra-gateway-local-dev
      # Spans leave over OTLP/HTTP, under the variable OpenTelemetry specifies.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # No published port: the Gateway is reachable only through the edge, as in production.
    depends_on:
      keycloak:
        condition: service_healthy
      tenant-user-management:
        condition: service_healthy

  apisix:
    build: ./apisix
    image: orchestra-local/apisix:3.18.0
    ports:
      - "9080:9080"
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Where the edge and both services export their spans, over OTLP/HTTP. Its debug exporter prints
  # every span to its log, and it sends every span on to Tempo. No published port, and no service
  # waits for it: telemetry is best effort.
  otel-collector:
    build: ./otel-collector
    image: orchestra-local/otel-collector:0.160.0

  # The trace store (ADR-0028). Only the Collector writes to it and only Grafana reads it, so it has no
  # published port. Its traces go with `make reset`.
  tempo:
    build: ./tempo
    image: orchestra-local/tempo:3.0.3
    volumes:
      - tempo-data:/var/tempo

  # Reads the traces in Tempo at http://localhost:3000. Local development only: it has no login and
  # anyone who reaches it is an administrator, so its port is published on this machine alone.
  grafana:
    build: ./grafana
    image: orchestra-local/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata: {}
  tempo-data: {}
