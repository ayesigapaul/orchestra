# Every refusal the edge makes is a JSON:API error document, whichever route is matched or none, and
# no request content over 1 MiB is accepted.
global_rules:
  - id: json-api
    plugins:
      orchestra-json-api: {}
      # Refuses content over the limit with 413 before any credential is checked, and bounds what
      # nginx reads of a body that declares no length (http-conventions.md section 4).
      client-control:
        max_body_size: 1048576

routes:
  - id: gateway
    uri: /*
    plugins:
      openid-connect:
        client_id: apisix
        client_secret: apisix-local-dev
        discovery: http://keycloak:8080/realms/orchestra/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        realm: orchestra
        # The Gateway verifies the credential itself and never reads identity from the edge
        # (ADR-0018), so the edge does not offer it one.
        set_userinfo_header: false
    upstream:
      type: roundrobin
      nodes:
        "gateway:8000": 1
#END
