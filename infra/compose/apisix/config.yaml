# Standalone mode: routes come from apisix.yaml in this repository, not from etcd, so every route
# is versioned and reviewed like code (ADR-0018 follow-on).
apisix:
  # Orchestra's own plugin, baked in under orchestra/, is found before the built-in ones.
  extra_lua_path: "/usr/local/apisix/orchestra/?.lua"

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Only the plugins the routes use are loaded, so a plugin nobody configured is not attack surface.
plugins:
  - orchestra-json-api
  - client-control
  - opentelemetry
  - openid-connect

nginx_config:
  # One JSON line per request, under the names the services log with: the edge's trace and span, the
  # request identifier the caller was given, and OpenTelemetry's HTTP attribute names. escape=json
  # keeps whatever a caller sends inside its string.
  http:
    access_log_format: '{"time":"$time_iso8601","message":"request served","trace_id":"$opentelemetry_trace_id","span_id":"$opentelemetry_span_id","request_id":"$sent_http_orchestra_request_id","http.request.method":"$request_method","url.path":"$uri","http.response.status_code":$status,"http.server.request.duration":$request_time,"client.address":"$remote_addr","user_agent.original":"$http_user_agent"}'
    access_log_format_escape: json
  # Errors nginx raises itself, such as an upstream it cannot reach or a request over a size limit,
  # never pass through a plugin. They are answered with the same JSON:API error documents (ADR-0025,
  # HC13). A request line or header field longer than 8 KiB is refused with 414 or 431. The limit on
  # request content is client-control's, in apisix.yaml, because it refuses before authentication.
  http_server_configuration_snippet: |
    large_client_header_buffers 4 8k;
    error_page 400 413 500 502 503 504 @orchestra_error;
    # A request line nginx could not read has no URI yet, and a named location needs one.
    error_page 414 /.orchestra/uri-too-long;
    # nginx reports oversized header fields as 400, so the 431 of RFC 6585 is given explicitly.
    error_page 494 @orchestra_header_fields_too_large;
    location @orchestra_error {
        content_by_lua_block {
            require("apisix.plugins.orchestra-json-api").error_page()
        }
    }
    location @orchestra_header_fields_too_large {
        content_by_lua_block {
            require("apisix.plugins.orchestra-json-api").error_page(431)
        }
    }
    location = /.orchestra/uri-too-long {
        internal;
        content_by_lua_block {
            require("apisix.plugins.orchestra-json-api").error_page(414)
        }
    }
