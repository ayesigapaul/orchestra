name: UI template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: UI template
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-template/control-plane
    steps:
      - uses: actions/checkout@v7
      # No path filter on this workflow. A required check that is skipped by a path
      # filter never reports, and the pull request then waits on it forever.
      # defaults.run.working-directory applies to run steps only, so this action still
      # resolves package_json_file from the workspace root and must be told where to look.
      # It reads the pinned packageManager from there, keeping one source of truth.
      # v6.1.0 is the first release that installs pnpm 12, and the floating v6 tag still
      # points behind it, so the exact release is pinned.
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: ui-template/control-plane/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: ui-template/control-plane/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # A pull request must not introduce a vulnerable dependency, so this fails there.
      # On main it only reports: an advisory can be published against code nobody has
      # touched, and that must not turn the branch red. Dependabot alerts and automated
      # security fixes are enabled for exactly that case.
      - name: Audit
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: pnpm audit
