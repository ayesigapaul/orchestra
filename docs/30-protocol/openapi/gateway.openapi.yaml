openapi: 3.1.2
info:
  title: Orchestra Gateway
  version: 0.1.0
  summary: The public HTTP boundary, reached through the edge.
  description: |
    Every response is a JSON:API 1.1 document, and every failure an error document with a registered
    code and a retry safety — see docs/30-protocol/http-conventions.md (ADR-0025).

    **Local stack.** Bring it up with `infra/compose/smoke.sh`. The Gateway has no published port: it
    is reached through the edge, APISIX, on `http://localhost:9080`, where every route requires a
    bearer credential. The `keycloakLocal` security scheme fetches one with the local stack's
    throwaway user, so Postman's "Get New Access Token" works as imported.

    This is Phase 0 of the contract. Credential resolution to a Principal and a Tenant, and the
    resource paths of `gateway-api.md`, are not here yet.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:9080
    description: Local stack, through the edge (infra/compose)
security:
  - keycloakLocal: []
tags:
  - name: Health
    description: Whether the Gateway is serving.
  - name: Diagnostics
    description: Not part of the contract. Removed once credential resolution replaces it.
paths:
  /healthz:
    get:
      operationId: getGatewayHealth
      tags:
        - Health
      summary: Report the Gateway's health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
  /_probe/identity:
    get:
      operationId: probeIdentity
      tags:
        - Diagnostics
      summary: Show the subject and issuer of the verified credential
      description: Proves the path from the edge to a credential the Gateway verified itself. An identity asserted in a header, such as X-Userinfo, is never a credential. Not part of the contract.
      responses:
        '200':
          description: The credential was verified.
          headers:
            Orchestra-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IdentityProbeDocument'
              example:
                jsonapi:
                  version: '1.1'
                data:
                  type: identity-probes
                  id: <subject>
                  attributes:
                    subject: <subject>
                    issuer: http://localhost:8080/realms/orchestra
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    keycloakLocal:
      type: oauth2
      description: Local stack only. Client `orchestra-cli`, user `dev`, password `dev-local-only` — throwaway values from infra/compose, valid nowhere else.
      flows:
        password:
          tokenUrl: http://localhost:8080/realms/orchestra/protocol/openid-connect/token
          scopes: {}
  schemas:
    IdentityProbeDocument:
      type: object
      required:
        - jsonapi
        - data
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        data:
          type: object
          required:
            - type
            - id
            - attributes
          properties:
            type:
              type: string
              const: identity-probes
            id:
              type: string
            attributes:
              type: object
              required:
                - subject
                - issuer
              properties:
                subject:
                  type: string
                issuer:
                  type: string
    JsonApiObject:
      type: object
      description: The JSON:API version this document follows.
      required:
        - version
      properties:
        version:
          type: string
          const: '1.1'
    MetaDocument:
      type: object
      description: A JSON:API document carrying only metadata, such as a health report (HC6).
      required:
        - jsonapi
        - meta
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        meta:
          type: object
    HealthDocument:
      allOf:
        - $ref: '#/components/schemas/MetaDocument'
        - type: object
          properties:
            meta:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  const: ok
    ErrorObject:
      type: object
      description: One problem with the request (HC8). Programs branch on `code`, never on `detail`.
      required:
        - id
        - status
        - code
        - title
        - meta
      properties:
        id:
          type: string
          description: This occurrence's identifier; the request identifier.
        links:
          type: object
          properties:
            about:
              type: string
              format: uri-reference
            type:
              type: string
              format: uri-reference
              description: Documentation for this code.
        status:
          type: string
          pattern: ^[45][0-9]{2}$
        code:
          type: string
          description: A registered code, class.name. Classes are request, auth, governance, resource, quota, upstream and server; an unknown code is treated as its class (HC9).
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
        title:
          type: string
          description: The code's fixed summary.
        detail:
          type: string
          description: This occurrence, for a person. Free to change; never parsed.
        source:
          type: object
          properties:
            pointer:
              type: string
              description: A JSON Pointer to the offending request member.
            parameter:
              type: string
              description: The offending query parameter.
            header:
              type: string
              description: The offending request header.
        meta:
          type: object
          required:
            - retry
          properties:
            retry:
              type: string
              enum:
                - safe
                - unsafe
                - indeterminate
              description: Whether sending the same request again is safe (HC10).
            decision_ref:
              type: string
              description: For a governance refusal only, an opaque reference to the Policy Decision.
    ErrorDocument:
      type: object
      description: Every failure's body (HC7). Never carries `data`.
      required:
        - jsonapi
        - errors
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
  headers:
    RequestId:
      description: This request's identifier. Equal to the `id` of any error in the body (HC12).
      schema:
        type: string
    WwwAuthenticate:
      description: The authentication scheme the caller must use.
      schema:
        type: string
  responses:
    Healthy:
      description: The service is healthy.
      headers:
        Orchestra-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/HealthDocument'
          example:
            jsonapi:
              version: '1.1'
            meta:
              status: ok
    Unauthenticated:
      description: No credential, or one that failed verification. The reason is never disclosed.
      headers:
        Orchestra-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.1'
            errors:
              - id: 1d8e9a77-3b2c-4a41-8f0e-5c6d7e8f9a10
                status: '401'
                code: auth.unauthenticated
                title: A valid credential is required
                meta:
                  retry: unsafe
    NotAcceptable:
      description: The Accept header asks only for JSON:API media type parameters this service does not support.
      headers:
        Orchestra-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.1'
            errors:
              - id: 4d5e6f70-8192-4a34-9c5d-6e7f80910213
                status: '406'
                code: request.not_acceptable
                title: No acceptable representation
                source:
                  header: Accept
                meta:
                  retry: unsafe
    InternalError:
      description: An unhandled fault. The detail is generic by design.
      headers:
        Orchestra-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          example:
            jsonapi:
              version: '1.1'
            errors:
              - id: 92a3b4c5-d6e7-4f89-8192-132435465768
                status: '500'
                code: server.internal
                title: Something went wrong on our side
                detail: The request could not be completed. Quote the request identifier when reporting it.
                meta:
                  retry: safe
