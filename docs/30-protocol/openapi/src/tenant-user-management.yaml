openapi: 3.1.2
info:
  title: Orchestra Tenant User Management
  version: 0.1.0
  summary: Tenants, Persons, Memberships and Principals, and credential resolution for the Gateway.
  description: |
    An internal service: the Gateway and the Control Plane API call it, and so will Orchestra's
    provisioning client, to create a Tenant (ADR-0031); no end client does (ADR-0024). Every response
    is a JSON:API 1.1 document, and every failure an error document with a registered code and a
    retry safety — see docs/30-protocol/http-conventions.md (ADR-0025).

    **Run it locally** with `pnpm start` in `services/tenant-user-management`; it listens on
    `http://localhost:8080`. In the local stack it has no published port, and only other services
    reach it.

    **Credential resolution** is specified normatively by docs/30-protocol/credential-resolution.md.
    Its caller authenticates with its own access token (HC17). Locally, the Gateway obtains one from
    the local Keycloak with the client credentials grant as client `orchestra-gateway`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Run directly with pnpm start
security: []
tags:
  - name: Health
    description: Whether the service is serving.
  - name: Credential resolution
    description: Turning a verified credential into exactly one Principal and one Tenant.
paths:
  /healthz:
    get:
      operationId: getTenantUserManagementHealth
      tags: [Health]
      summary: Report the service's health
      responses:
        '200':
          $ref: './json-api.yaml#/components/responses/Healthy'
        '400':
          $ref: './json-api.yaml#/components/responses/BadRequest'
        '406':
          $ref: './json-api.yaml#/components/responses/NotAcceptable'
        '415':
          $ref: './json-api.yaml#/components/responses/UnsupportedMediaType'
        '500':
          $ref: './json-api.yaml#/components/responses/InternalError'
        '503':
          $ref: './json-api.yaml#/components/responses/Unavailable'
  /credential-resolutions:
    post:
      operationId: resolveCredential
      tags: [Credential resolution]
      summary: Resolve a verified credential to exactly one Principal and one Tenant
      description: >-
        Nothing is stored, so sending the same request again is always safe. A rejection is an
        answer rather than an error: every reason a credential does not resolve answers 200 with
        outcome rejected, and the reason goes only to the service's log. Only the Gateway may call
        it (credential-resolution.md CR2).
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CredentialResolutionRequest'
            example:
              data:
                type: credential-resolutions
                attributes:
                  credential: <access-token>
      responses:
        '200':
          description: The credential resolved to one Principal and one Tenant, or it did not.
          headers:
            Orchestra-Request-Id:
              $ref: './json-api.yaml#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CredentialResolutionDocument'
              examples:
                resolved:
                  summary: The credential resolved
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: credential-resolutions
                      id: <request-id>
                      attributes:
                        outcome: resolved
                        tenant_id: <tenant-id>
                        principal_id: <principal-id>
                        principal_kind: platform-user
                rejected:
                  summary: The credential did not resolve; the reason is only logged
                  value:
                    jsonapi: { version: '1.1' }
                    data:
                      type: credential-resolutions
                      id: <request-id>
                      attributes:
                        outcome: rejected
        '400':
          $ref: './json-api.yaml#/components/responses/BadRequest'
        '401':
          $ref: './json-api.yaml#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '406':
          $ref: './json-api.yaml#/components/responses/NotAcceptable'
        '415':
          $ref: './json-api.yaml#/components/responses/UnsupportedMediaType'
        '422':
          $ref: './json-api.yaml#/components/responses/UnprocessableContent'
        '500':
          $ref: './json-api.yaml#/components/responses/InternalError'
        '503':
          $ref: './json-api.yaml#/components/responses/Unavailable'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The calling service's own access token, from the client credentials grant, with
        tenant-user-management as its audience (HC17). Never an end user's credential.
  responses:
    CallerForbidden:
      description: The caller's token verified, but that caller may not resolve credentials.
      headers:
        Orchestra-Request-Id:
          $ref: './json-api.yaml#/components/headers/RequestId'
      content:
        application/vnd.api+json:
          schema:
            $ref: './json-api.yaml#/components/schemas/ErrorDocument'
          example:
            jsonapi: { version: '1.1' }
            errors:
              - id: d6e7f809-1021-4324-8536-576879809102
                status: '403'
                code: auth.forbidden
                title: This operation needs a grant the caller does not hold
                meta: { retry: unsafe }
  schemas:
    CredentialResolutionRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type:
              type: string
              const: credential-resolutions
            attributes:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  minLength: 1
                  description: The access token to resolve. Never logged, stored or echoed (CR3).
    CredentialResolutionDocument:
      type: object
      required: [jsonapi, data]
      properties:
        jsonapi:
          $ref: './json-api.yaml#/components/schemas/JsonApiObject'
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type:
              type: string
              const: credential-resolutions
            id:
              type: string
              description: This request's identifier. A resolution is not stored, so it has no other.
            attributes:
              oneOf:
                - type: object
                  required: [outcome, tenant_id, principal_id, principal_kind]
                  properties:
                    outcome:
                      type: string
                      const: resolved
                    tenant_id:
                      type: string
                      format: uuid
                    principal_id:
                      type: string
                      format: uuid
                    principal_kind:
                      type: string
                      enum: [platform-user]
                - type: object
                  required: [outcome]
                  properties:
                    outcome:
                      type: string
                      const: rejected
