openapi: 3.1.2
info:
  title: Orchestra Gateway
  version: 0.3.0
  summary: The public HTTP boundary, reached through the edge.
  description: |
    Every response is a JSON:API 1.1 document, and every failure an error document with a registered
    code and a retry safety — see docs/30-protocol/http-conventions.md (ADR-0025).

    **Local stack.** Bring it up with `infra/compose/smoke.sh`. The Gateway has no published port: it
    is reached through the edge, APISIX, on `http://localhost:9080`, where every route requires a
    bearer credential. The `keycloakLocal` security scheme fetches one with the local stack's
    throwaway user and the `organization` scope, so Postman's "Get New Access Token" works as
    imported.

    **Every credential is resolved** to exactly one Principal and one Tenant by Tenant User
    Management before anything proceeds — see docs/30-protocol/credential-resolution.md. A credential
    that does not resolve is refused exactly like one that fails verification, and a resolution that
    cannot complete is a 503 that is safe to retry. The resource paths of `gateway-api.md` are not
    here yet.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:9080
    description: Local stack, through the edge (infra/compose)
security:
  - keycloakLocal: [organization]
tags:
  - name: Health
    description: Whether the Gateway is serving.
  - name: Diagnostics
    description: Not part of the contract. Removed when the first resource of gateway-api.md arrives.
paths:
  /healthz:
    get:
      operationId: getGatewayHealth
      tags: [Health]
      summary: Report the Gateway's health
      responses:
        '200':
          $ref: './json-api.yaml#/components/responses/Healthy'
        '400':
          $ref: './json-api.yaml#/components/responses/BadRequest'
        '401':
          $ref: './json-api.yaml#/components/responses/Unauthenticated'
        '406':
          $ref: './json-api.yaml#/components/responses/NotAcceptable'
        '413':
          $ref: './json-api.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: './json-api.yaml#/components/responses/UriTooLong'
        '415':
          $ref: './json-api.yaml#/components/responses/UnsupportedMediaType'
        '431':
          $ref: './json-api.yaml#/components/responses/HeaderFieldsTooLarge'
        '500':
          $ref: './json-api.yaml#/components/responses/InternalError'
        '502':
          $ref: './json-api.yaml#/components/responses/OutcomeUnknown'
        '503':
          $ref: './json-api.yaml#/components/responses/UpstreamUnavailable'
  /_probe/identity:
    get:
      operationId: probeIdentity
      tags: [Diagnostics]
      summary: Show the Principal and Tenant the credential resolved to
      description: >-
        Proves the whole path: the edge, a credential the Gateway verified itself, and its
        resolution to one Principal in one Tenant by Tenant User Management. An identity asserted in
        a header, such as X-Userinfo, is never a credential. Not part of the contract.
      responses:
        '200':
          description: The credential was verified, and resolved to one Principal in one Tenant.
          headers:
            Orchestra-Request-Id:
              $ref: './json-api.yaml#/components/headers/RequestId'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IdentityProbeDocument'
              example:
                jsonapi: { version: '1.1' }
                data:
                  type: identity-probes
                  id: <principal-id>
                  attributes:
                    tenant_id: <tenant-id>
                    principal_id: <principal-id>
                    principal_kind: platform-user
        '400':
          $ref: './json-api.yaml#/components/responses/BadRequest'
        '401':
          $ref: './json-api.yaml#/components/responses/Unauthenticated'
        '406':
          $ref: './json-api.yaml#/components/responses/NotAcceptable'
        '413':
          $ref: './json-api.yaml#/components/responses/ContentTooLarge'
        '414':
          $ref: './json-api.yaml#/components/responses/UriTooLong'
        '415':
          $ref: './json-api.yaml#/components/responses/UnsupportedMediaType'
        '431':
          $ref: './json-api.yaml#/components/responses/HeaderFieldsTooLarge'
        '500':
          $ref: './json-api.yaml#/components/responses/InternalError'
        '503':
          $ref: './json-api.yaml#/components/responses/UpstreamUnavailable'
components:
  securitySchemes:
    keycloakLocal:
      type: oauth2
      description: >-
        Local stack only. Client `orchestra-cli`, user `dev`, password `dev-local-only` — throwaway
        values from infra/compose, valid nowhere else. The `organization` scope is required: it puts
        the Organization in the credential, and resolution needs exactly one.
      flows:
        password:
          tokenUrl: http://localhost:8080/realms/orchestra/protocol/openid-connect/token
          scopes:
            organization: The Organization the user acts in, which resolves to its Tenant.
  schemas:
    IdentityProbeDocument:
      type: object
      required: [jsonapi, data]
      properties:
        jsonapi:
          $ref: './json-api.yaml#/components/schemas/JsonApiObject'
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type:
              type: string
              const: identity-probes
            id:
              type: string
              description: The Principal's identifier.
            attributes:
              type: object
              required: [tenant_id, principal_id, principal_kind]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                principal_id:
                  type: string
                  format: uuid
                principal_kind:
                  type: string
                  enum: [platform-user]
